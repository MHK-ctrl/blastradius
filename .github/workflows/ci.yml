name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q

  guard-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . pytest
      - name: Without the guard the demo must duplicate
        run: pytest -q tests/test_demo_regression.py::test_without_guard_the_retry_duplicates
      - name: With the guard the demo must not duplicate
        run: pytest -q tests/test_demo_regression.py::test_with_guard_the_retry_does_not_duplicate
      - name: Removing the guard must reintroduce the duplicate
        run: pytest -q tests/test_demo_regression.py::test_removing_the_guard_reintroduces_the_duplicate
